
<!DOCTYPE html>
<html lang="en" class="{{ theme }}-theme">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Gadicherla Yugendar's portfolio - Python Developer and AI enthusiast.">

    <title>
        {% block title %}Yugendar | Developer Portfolio{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='css/style.css') }}">
</head>

<body class="{{ theme }}-theme">

    <!-- NAVBAR -->

    <header class="header">
        <div class="container navbar">

            <a href="#home" class="logo">
                Y<span>.</span>
            </a>

            <nav class="nav-links">

                <a href="#home">Home</a>

                <a href="#about">About</a>

                <a href="#skills">Skills</a>

                <a href="#projects">Projects</a>

                <a href="#contact">Contact</a>

            </nav>

            <form action="/set-theme" method="POST">

                <button type="submit" class="theme-btn">

                    {% if theme == "dark" %}
                        ☀ Light
                    {% else %}
                        ☾ Dark
                    {% endif %}

                </button>

            </form>

        </div>
    </header>



    <main>

        {% block content %}
        {% endblock %}

    </main>



    

    </footer>

</body>

</html>
